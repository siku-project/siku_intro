name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build web
        working-directory: web
        run: |
          bun install
          bun run build

      - name: Assemble package
        run: |
          mkdir -p package/siku_intro/web
          cp -r client server config translations fxmanifest.lua README.md package/siku_intro/
          cp -r web/dist package/siku_intro/web/dist
          cd package
          zip -r ../siku_intro.zip siku_intro
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" siku_intro.zip --clobber
